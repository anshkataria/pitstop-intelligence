global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: spring-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: fastapi-ml
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-service:8000"]

  - job_name: historical-ingestion
    static_configs:
      - targets: ["ingestion-scheduler:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
