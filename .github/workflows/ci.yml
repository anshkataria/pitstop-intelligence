name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot
        run: ./mvnw --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test Angular
        run: npm test -- --watch=false
      - name: Build Angular
        run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ml-service, ingestion]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ${{ matrix.project }}
      - name: Test ${{ matrix.project }}
        run: PYTHONPATH=src pytest -q
        working-directory: ${{ matrix.project }}

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, python]
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build service images
        run: docker compose --env-file .env.example build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, python]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run full-stack browser tests
        run: ./scripts/run-e2e.sh
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
