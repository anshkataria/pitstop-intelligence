services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pitstop-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: pitstop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pitstop-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pitstop-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_SERVICE_URL: http://ml-service:8000
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-pitstop-development-ml-internal-token}
      JWT_SECRET: ${JWT_SECRET:-pitstop-development-secret-change-before-production-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pitstop-ml-service
    expose:
      - "8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_TRACKING_URI: file:./mlruns
      MODEL_PATH: ./models/race_predictor.json
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-pitstop-development-ml-internal-token}
    volumes:
      - ml_models:/app/models
      - ml_runs:/app/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: pitstop-ingestion
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ERGAST_BASE_URL: https://api.jolpi.ca/ergast/f1
      SEASONS_TO_FETCH: ${SEASONS_TO_FETCH:-2023,2024}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles:
      - ingestion

  ingestion-scheduler:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: pitstop-ingestion-scheduler
    command: ["python", "-m", "pitstop.scheduler"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ERGAST_BASE_URL: https://api.jolpi.ca/ergast/f1
      SEASONS_TO_FETCH: ${SEASONS_TO_FETCH:-2023,2024}
      INGESTION_CRON: "${INGESTION_CRON:-0 3 * * 1}"
      INGESTION_TIMEZONE: ${INGESTION_TIMEZONE:-UTC}
      INGESTION_RUN_ON_STARTUP: ${INGESTION_RUN_ON_STARTUP:-false}
      INGESTION_METRICS_PORT: 9101
      INGESTION_ALERT_WEBHOOK_URL: ${INGESTION_ALERT_WEBHOOK_URL:-}
    expose:
      - "9101"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: pitstop-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      ingestion-scheduler:
        condition: service_healthy
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:13.0.2
    container_name: pitstop-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  ml_models:
  ml_runs:
  prometheus_data:
  grafana_data:
