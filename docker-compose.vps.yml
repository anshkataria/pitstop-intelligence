services:
  frontend:
    image: ghcr.io/${GHCR_REPOSITORY:?Set GHCR_REPOSITORY}-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    ports: !reset []

  backend:
    image: ghcr.io/${GHCR_REPOSITORY:?Set GHCR_REPOSITORY}-backend:${IMAGE_TAG:?Set IMAGE_TAG}

  ml-service:
    image: ghcr.io/${GHCR_REPOSITORY:?Set GHCR_REPOSITORY}-ml-service:${IMAGE_TAG:?Set IMAGE_TAG}

  ingestion:
    image: ghcr.io/${GHCR_REPOSITORY:?Set GHCR_REPOSITORY}-ingestion:${IMAGE_TAG:?Set IMAGE_TAG}

  ingestion-scheduler:
    image: ghcr.io/${GHCR_REPOSITORY:?Set GHCR_REPOSITORY}-ingestion:${IMAGE_TAG:?Set IMAGE_TAG}

  gateway:
    image: caddy:2-alpine
    container_name: pitstop-gateway
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
